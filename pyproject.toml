[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "acquiscout"
version = "0.1.0"
description = "Source-backed M&A prospect pipeline for Tampa Bay title and property management firms"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "tenacity>=8.3",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
agents = [
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "aiosqlite>=0.22,<1",
    "groq>=1.7,<2",
    "langsmith>=0.14,<0.15",
]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.30"]
ui = ["streamlit>=1.36"]
scrape = [
    "tavily-python>=0.5",
    "firecrawl-py>=1.0",
    "redis>=5.0",
    "trafilatura>=2.0",
    "lxml>=5.0",
    "tldextract>=5.1",
]
eval = [
    "llm-guard>=0.3",
    "openpyxl>=3.1",
    "trafilatura>=2.0",
    "tldextract>=5.1",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "langgraph-cli[inmem]>=0.4,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
files = ["src"]
strict = true
